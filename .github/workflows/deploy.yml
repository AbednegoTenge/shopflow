name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: shopflow-app
  ECS_CLUSTER: shopflow-cluster
  ECS_SERVICE: shopflow-app-service
  ECS_TASK_FAMILY: shopflow-app
  CONTAINER_NAME: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::559000568151:role/shopflow-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # runner is amd64; the ECS task definition requires ARM64 (Fargate
      # runtime_platform), so this must cross-build, not just `docker build`
      - name: Build and push image (linux/arm64)
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./app
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query "taskDefinition" \
            --output json > task-def.json

      - name: Patch task definition with the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - name: Register new revision and update the service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Smoke test
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names shopflow-alb \
            --query "LoadBalancers[0].DNSName" \
            --output text \
            --region "$AWS_REGION")

          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_DNS/health" --max-time 5 || true)
            if [ "$code" = "200" ]; then
              echo "Smoke test passed ($code)"
              exit 0
            fi
            echo "Attempt $i: got $code, retrying..."
            sleep 5
          done

          echo "Smoke test failed — /health never returned 200"
          exit 1
